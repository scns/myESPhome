name: Publish website and firmware
# Firmware is built only as part of website publication, never on push/PR.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-website
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.settings.outputs.devices }}
      version: ${{ steps.settings.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/project.py check
      - run: python -m unittest discover -s tests
      - run: node --test tests/installer.test.cjs
      - run: python scripts/project.py validate
      - id: settings
        run: python scripts/project.py settings >> "$GITHUB_OUTPUT"
  firmware:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.prepare.outputs.devices) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Pin dashboard import to the published commit
        env:
          DEVICE: ${{ matrix.device }}
          REVISION: ${{ github.sha }}
        run: python scripts/project.py pin-import "$DEVICE" "$REVISION"
      - name: Build publication firmware
        id: build
        # ESPHome build-action v8.0.0; immutable revision.
        uses: esphome/build-action@6b9d3f593d626a2f0d2c17daebf0a97957d67425
        with:
          yaml-file: esphome/${{ matrix.device }}.yaml
          version: ${{ needs.prepare.outputs.version }}
          complete-manifest: true
          release-url: https://github.com/scns/myESPhome/releases
      - name: Verify and stage device artifact
        env:
          DEVICE: ${{ matrix.device }}
          BUILD_DIRECTORY: ${{ steps.build.outputs.name }}
        run: python scripts/project.py stage "$DEVICE" "$BUILD_DIRECTORY" staged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.device }}
          path: staged/
          if-no-files-found: error
  assemble:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          path: firmwares
          merge-multiple: true
      - run: python scripts/project.py assemble firmwares output
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output
  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
