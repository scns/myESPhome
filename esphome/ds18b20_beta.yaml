---
# DS18B20 Temperature Sensor
#
# A simple ESPHome integration for DS18B20 temperature sensor
# © Maarten Schmeitz
#
substitutions:
  device_name: "ds18b20_beta"
  
esphome:
  name: '${device_name}'
  name_add_mac_suffix: true
  comment: '${device_description}'
  project:
    name: "scns.myESPHome_${device_name}"
    version: "${project_version}"
  min_version: 2026.9.1

esp8266:
  board:  d1_mini
  restore_from_flash: true


dashboard_import:
  package_import_url: github://scns/myESPhome/esphome/ds18b20_beta.yaml

packages:
  basis_esp8266_beta: !include package/basis_esp8266_beta.yaml
  ds18b20_beta: !include package/ds18b20_beta.yaml
  basis_settings_beta: !include package/basis_settings_beta.yaml
