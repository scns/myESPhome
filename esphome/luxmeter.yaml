---
# Luxmeter
#
# a simple ESPHome integration to make an luxmeter
# © Maarten Schmeitz
#
substitutions:
  device_name: "luxmeter"
  
esphome:
  name: '${device_name}'
  name_add_mac_suffix: true
  comment: '${device_description}'
  project:
    name: "scns.myESPHome_${device_name}"
    version: "${project_version}"
  min_version: 2026.9.1

esp8266:
  board:  d1_mini
  restore_from_flash: true


dashboard_import:
  package_import_url: github://scns/myESPhome/esphome/luxmeter.yaml

packages:
  basis_esp8266: !include package/basis_esp8266.yaml
  luxmeter: !include package/luxmeter.yaml
  basis_settings: !include package/basis_settings.yaml
