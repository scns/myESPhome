<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">FÖRNUFTIG wiring to WEMOS D1 Mini</title><desc id="desc">FG via a ten kiloohm resistor to D6, CLK to D7, R13 to D5 after cutting the trace to U1. A 24 volt capable regulator supplies five volts. All grounds are connected.</desc><rect width="1000" height="540" rx="20" fill="#f2f3e9"/><g font-family="system-ui,sans-serif" fill="#123c34"><text x="40" y="45" font-size="24" font-weight="700">IKEA FÖRNUFTIG PCB</text><text x="760" y="45" font-size="24" font-weight="700">D1 Mini</text><text x="40" y="95" font-size="19">FG</text><path d="M260 89 H730" stroke="#32815c" stroke-width="3"/><text x="320" y="77" font-size="15">10 kΩ series resistor</text><text x="760" y="95" font-size="19">D6 / GPIO12</text><text x="40" y="160" font-size="19">CLK</text><path d="M260 154 H730" stroke="#2476b7" stroke-width="3"/><text x="320" y="142" font-size="15">Direct connection</text><text x="760" y="160" font-size="19">D7 / GPIO13</text><text x="40" y="225" font-size="19">R13 motor control</text><path d="M260 219 H730" stroke="#947016" stroke-width="3"/><text x="320" y="207" font-size="15">Cut R13 → U1 trace first</text><text x="760" y="225" font-size="19">D5 / GPIO14</text><text x="40" y="290" font-size="19">Regulator +5 V</text><path d="M260 284 H730" stroke="#ae453e" stroke-width="3"/><text x="320" y="272" font-size="15">Regulated supply only</text><text x="760" y="290" font-size="19">5V</text><text x="40" y="355" font-size="19">Common ground</text><path d="M260 349 H730" stroke="#44564e" stroke-width="3"/><text x="320" y="337" font-size="15">PCB + regulator + ESP</text><text x="760" y="355" font-size="19">G / GND</text><text x="40" y="435" font-size="19">PCB +24 V → regulator IN+; PCB GND → regulator IN−</text><text x="40" y="475" font-size="17">Optional sensor: D1/GPIO5 → SCL · D2/GPIO4 → SDA · 3V3 → VCC · G → GND</text><text x="40" y="510" font-size="15">Connection diagram, not PCB layout. Never connect 24 V to an ESP pin.</text></g></svg>